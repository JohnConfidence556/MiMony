<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMony: your shop's records, by chat</title>
<style>
  :root {
    --green: #008069;
    --green-deep: #075e54;
    --me: #d9fdd3;
    --bot: #ffffff;
    --wall: #efeae2;
    --time: #667781;
    --link: #027eb5;
    --text: #111b21;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #d1d7db; color: var(--text);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--wall); }

  /* header */
  header { background: var(--green-deep); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--green-deep);
    display: grid; place-items: center; font-size: 22px; font-weight: 800; flex: none;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2; }
  header span { font-size: 13px; opacity: .85; }

  /* chat wallpaper */
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column;
    background-color: var(--wall);
    background-image: radial-gradient(rgba(11, 20, 26, .07) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }

  /* notice at the top, like WhatsApp's system note */
  .notice {
    align-self: center; max-width: 92%; text-align: center; font-size: 13px; line-height: 1.4;
    background: #fff3c4; color: #54430d; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px;
    box-shadow: 0 1px .5px rgba(11, 20, 26, .13);
  }

  /* bubbles */
  .msg {
    position: relative; max-width: 82%; padding: 6px 9px 7px; border-radius: 8px; margin-bottom: 3px;
    font-size: 15px; line-height: 1.35; box-shadow: 0 1px .5px rgba(11, 20, 26, .13);
    animation: pop .15s ease-out;
  }
  .msg .text { white-space: pre-wrap; }
  .msg .time { float: right; margin: 8px 0 -4px 12px; font-size: 11px; color: var(--time); display: inline-flex; gap: 3px; align-items: center; }
  .ticks { color: #53bdeb; font-size: 12px; letter-spacing: -4px; margin-right: 4px; }
  .money { font-weight: 700; }
  .me { align-self: flex-end; background: var(--me); }
  .bot { align-self: flex-start; background: var(--bot); }
  .tail { margin-top: 8px; }
  .me.tail { border-top-right-radius: 0; }
  .bot.tail { border-top-left-radius: 0; }
  .me.tail::after, .bot.tail::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
  .me.tail::after { right: -8px; background: var(--me); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .bot.tail::before { left: -8px; background: var(--bot); clip-path: polygon(0 0, 100% 0, 100% 100%); }

  /* tappable reply buttons under a bubble */
  .replies { align-self: flex-start; width: 82%; display: flex; flex-direction: column; gap: 3px; margin-bottom: 3px; }
  .replies button {
    font: inherit; font-size: 14.5px; color: var(--link); background: #fff; border: none; cursor: pointer;
    padding: 10px 12px; border-radius: 8px; text-align: center; box-shadow: 0 1px .5px rgba(11, 20, 26, .13);
  }
  .replies button:hover { background: #f5f6f6; }

  /* typing indicator */
  .typing { display: flex; gap: 4px; padding: 12px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg, .typing i { animation: none; } }

  /* quick pills + composer */
  .quick { display: flex; gap: 8px; padding: 8px 12px; background: #f0f2f5; flex-wrap: wrap; }
  .quick button {
    font: inherit; font-size: 13.5px; color: var(--link); background: #fff; border: 1px solid #d1d7db;
    border-radius: 16px; padding: 4px 14px; cursor: pointer;
  }
  form { display: flex; gap: 8px; padding: 6px 10px 10px; background: #f0f2f5; align-items: center; }
  input { flex: 1; border: none; border-radius: 22px; padding: 12px 16px; font-size: 15.5px; font-family: inherit; background: #fff; }
  input:focus { outline: none; }
  form button {
    width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--green); cursor: pointer;
    display: grid; place-items: center; flex: none;
  }
  form button svg { width: 20px; height: 20px; fill: #fff; }
  button:focus-visible { outline: 3px solid #53bdeb; outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">₦</div>
    <div>
      <h1>MiMony</h1>
      <span>Your shop's bookkeeper</span>
    </div>
  </header>

  <div id="chat">
    <div class="notice">
      MiMony keeps your shop's records. Tell it what you sold or bought, and it writes it in your ledger, shows your weekly profit, and tells you who still owes you.
    </div>
  </div>

  <div class="quick">
    <button type="button" data-text="Yes">Yes</button>
    <button type="button" data-text="No">No</button>
    <button type="button" data-text="Who owe me?">Who owes me?</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Type a sale or expense" autocomplete="off" aria-label="Type a sale or expense">
    <button aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M3 20.5v-6.9L12 12 3 10.4V3.5L22 12 3 20.5z"/></svg>
    </button>
  </form>
</div>

<script>
  const USER_ID = "adaeze";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const MONEY = /(₦[\d,]+)/;
  let lastWho = null;

  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who + (lastWho !== who ? " tail" : "");
    lastWho = who;

    const body = document.createElement("span");
    body.className = "text";
    text.split(MONEY).forEach((part) => {
      if (who === "bot" && MONEY.test(part)) {
        const s = document.createElement("span");
        s.className = "money";
        s.textContent = part;
        body.appendChild(s);
      } else {
        body.appendChild(document.createTextNode(part));
      }
    });
    div.appendChild(body);

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = nowTime();
    if (who === "me") {
      const t = document.createElement("span");
      t.className = "ticks";
      t.textContent = "✓✓";
      time.appendChild(t);
    }
    div.appendChild(time);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const d = document.createElement("div");
    d.className = "msg bot typing" + (lastWho !== "bot" ? " tail" : "");
    d.innerHTML = "<i></i><i></i><i></i>";
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function addReplies(options) {
    const box = document.createElement("div");
    box.className = "replies";
    options.forEach((o) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = o;
      b.addEventListener("click", () => { box.remove(); send(o); });
      box.appendChild(b);
    });
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send(text) {
    addMsg(text, "me");
    const typing = showTyping();
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: USER_ID, message: text }),
      });
      const data = await res.json();
      typing.remove();
      lastWho = "me";
      addMsg(data.reply, "bot");
    } catch (err) {
      typing.remove();
      lastWho = "me";
      addMsg("I can't reach the server. Check your connection and send again.", "bot");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });

  document.querySelectorAll(".quick [data-text]").forEach((b) =>
    b.addEventListener("click", () => send(b.dataset.text))
  );

  addMsg("Hello! Tell me what you sold or bought, the way you would tell a friend. Try one of these:", "bot");
  addReplies([
    "Sold 2 bags rice 45k each to Mama Chidi",
    "I buy pepper 12k, transport 2,500",
    "Who owe me?",
  ]);
</script>
</body>
</html>
